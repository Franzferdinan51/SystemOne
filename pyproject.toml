[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "systemone"
version = "0.1.0"
description = "Local, keyless Jev-style typed decisions — choice, score, noul — on GLiClass or SGLang"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ryan Smith" }]
keywords = ["gliclass", "sglang", "jev", "decision-engine", "local-ai", "zero-shot-classification"]
dependencies = [
    # Slim by default: the SGLang backend, the shim's SGLang-engine mode,
    # and the HTTP client need only numpy + stdlib. The torch/GLiClass
    # local engine lives in the `local` extra below.
    # Floor pins: unpinned deps drift across installs (audit 2026-10-02).
    "numpy>=1.24",
]

[project.optional-dependencies]
local = [
    # torch resolves per platform from stock pip wheels: CUDA-enabled on
    # Linux/Windows, MPS-capable on macOS (Apple Silicon). SystemOne
    # auto-selects the best device (CUDA > MPS > CPU); override with
    # SYSTEMONE_DEVICE=cuda|mps|cpu|auto. For a slim CPU-only Linux
    # install, pre-install torch from the CPU index first (see README):
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "torch>=2.0",
    "transformers>=4.40",
    "huggingface_hub>=0.20",
    # No version to pin: GLiClass has no PyPI release; the git URL tracks
    # its default branch. Pin a commit in deploys that need it.
    "gliclass @ git+https://github.com/Franzferdinan51/GLiClass",
]
clef = [
    # Local Cloudflare clef / clef-flash engine (SYSTEMONE_ENGINE=clef).
    # Card-tested on torch 2.11 + transformers 5.10.2; transformers>=5
    # for the Qwen3.5 conditional-generation arch the releases load.
    "torch>=2.0",
    "transformers>=5.0",
    "huggingface_hub>=0.20",
    "safetensors>=0.4",
    "pillow>=9",
]
mcp = [
    "mcp<2",
    # CVE floor: pyjwt <2.15 has known auth-bypass advisories and rides in
    # via mcp's server deps (pip-audit 2026-10-01: CVE-2026-101918 et al).
    "pyjwt>=2.15",
]
dev = ["pytest>=7"]

[project.scripts]
systemone = "systemone.cli:main"
systemone-acp = "systemone.acp_server:main"

[tool.setuptools.packages.find]
include = ["systemone*"]

[tool.setuptools.package-data]
# The shim/sidecar load these via __file__; without this stanza wheels
# ship without them and pip installs break at runtime (audit 2026-10-02).
systemone = ["*.json"]

[tool.pytest.ini_options]
markers = ["slow: loads real model weights (opt-in; deselect with -m 'not slow')"]
